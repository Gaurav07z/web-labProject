<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoodOne | Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- ================================
         LOGO
    ================================= -->

    <a href="index.html" class="cart-logo">

        <img
            src="./images/logo.png"
            alt="GoodOne Logo"
        >

    </a>



    <!-- ================================
         CART
    ================================= -->

    <main class="cart-page">

        <section class="cart-card">


            <!-- HEADING -->

            <small>GOODONE SHOPPING CART</small>

            <h1>
                YOUR CART
            </h1>



            <!-- ============================
                 PRODUCT 1
            ============================= -->

            <div class="cart-item">

                <div class="cart-product">

                    <img
                        src="./images/1st-top-image.png"
                        alt="GoodOne Pro"
                    >

                    <div>

                        <h3>
                            GoodOne Pro
                        </h3>

                        <p>
                            Premium Wireless Headphones
                        </p>

                        <strong>
                            ₹7,999
                        </strong>

                    </div>

                </div>


                <div class="cart-controls">

                    <button
                        type="button"
                        onclick="decreasePro()"
                    >
                        −
                    </button>

                    <span id="proQuantity">
                        1
                    </span>

                    <button
                        type="button"
                        onclick="increasePro()"
                    >
                        +
                    </button>

                </div>


                <div class="cart-price">

                    ₹<span id="proTotal">
                        7,999
                    </span>

                </div>

            </div>



            <!-- ============================
                 PRODUCT 2
            ============================= -->

            <div class="cart-item">

                <div class="cart-product">

                    <img
                        src="./images/2nd-roseGold-image.png"
                        alt="GoodOne Air"
                    >

                    <div>

                        <h3>
                            GoodOne Air
                        </h3>

                        <p>
                            Wireless Headphones
                        </p>

                        <strong>
                            ₹6,499
                        </strong>

                    </div>

                </div>


                <div class="cart-controls">

                    <button
                        type="button"
                        onclick="decreaseAir()"
                    >
                        −
                    </button>

                    <span id="airQuantity">
                        1
                    </span>

                    <button
                        type="button"
                        onclick="increaseAir()"
                    >
                        +
                    </button>

                </div>


                <div class="cart-price">

                    ₹<span id="airTotal">
                        6,499
                    </span>

                </div>

            </div>



            <!-- ================================
                 CART SUMMARY
            ================================= -->

            <div class="cart-summary">


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        ₹<span id="subtotal">
                            14,498
                        </span>
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <span class="free">
                        FREE
                    </span>

                </div>


                <div class="summary-total">

                    <span>
                        TOTAL
                    </span>

                    <span>
                        ₹<span id="grandTotal">
                            14,498
                        </span>
                    </span>

                </div>


                <div class="cart-buttons">

                    <a
                        href="product.html"
                        class="continue-btn"
                    >
                        ← CONTINUE SHOPPING
                    </a>

                    <a
                        href="checkout.html"
                        class="checkout-btn"
                    >
                        CHECKOUT →
                    </a>

                </div>

            </div>


        </section>

    </main>



    <!-- ================================
         FOOTER
    ================================= -->

    <footer>

        <a
            href="index.html"
            class="footer-logo"
        >

            <img
                src="./images/logo.png"
                alt="GoodOne"
            >

        </a>


        <div>

            <a href="index.html">
                HOME
            </a>

            <a href="product.html">
                PRODUCT
            </a>

            <a href="about.html">
                ABOUT
            </a>

            <a href="contact.html">
                CONTACT
            </a>

            <a href="support.html">
                SUPPORT
            </a>

        </div>


        <p>
            © 2026 GOODONE. ALL RIGHTS RESERVED.
        </p>

    </footer>
</body>

</html>
