<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoodOne | Contact</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- LOGO -->
    <a href="index.html" class="contact-logo">
      <img src="./images/logo.png" alt="GoodOne Logo" />
    </a>
    <!-- CONTACT FORM -->
    <main class="contact-container">
      <section class="contact-card">
        <small>GET IN TOUCH</small>
        <h1>
          CONTACT<br />
          GOODONE
        </h1>
        <form action="#" method="post">
          <!-- ROW 1 -->
          <div class="contact-grid">
            <div class="contact-field">
              <label for="name"> Full Name </label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
              />
            </div>

            <div class="contact-field">
              <label for="email"> Email Address </label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>
          <!-- ROW 2 -->
          <div class="contact-grid">
            <div class="contact-field">
              <label for="phone"> Phone Number </label>
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
              />
            </div>
            <div class="contact-field">
              <label for="subject"> Subject </label>
              <select id="subject" name="subject">
                <option value="">Select a subject</option>
                <option>Product Information</option>
                <option>Order Support</option>
                <option>Payment Issue</option>
                <option>Product Complaint</option>
                <option>Other</option>
              </select>
            </div>
          </div>
          <!-- MESSAGE -->
          <div class="contact-field contact-full">
            <label for="message"> Your Message </label>
            <textarea
              id="message"
              name="message"
              placeholder="Enter your message"
              required
            ></textarea>
          </div>
          <!-- BUTTON -->
          <button type="submit" class="contact-btn">SEND MESSAGE →</button>
        </form>
      </section>
    </main>
    <!-- FOOTER -->
    <footer>
      <a href="index.html" class="footer-logo">
        <img src="./images/logo.png" alt="GoodOne" />
      </a>
      <div>
        <a href="index.html">HOME</a>
        <a href="product.html">PRODUCT</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
        <a href="support.html">SUPPORT</a>
      </div>
      <p>© 2026 GOODONE. ALL RIGHTS RESERVED.</p>
    </footer>
  </body>
</html>
